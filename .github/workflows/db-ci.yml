name: Database CI

# Backend/database integration gate. Runs against a throwaway local Supabase
# stack in Docker on the runner -- never the production project. There is no
# `supabase link` step, no project ref, and no secrets: if this workflow ever
# needs a credential, something has gone wrong.
#
# This is an additional gate, not a replacement. iOS build/tests and the static
# authority invariants still run in ios-ci.yml.

on:
  push:
    branches: [main, first-playable]
  pull_request:

jobs:
  database:
    name: migrations + pgTAP + concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show CLI version
        run: supabase --version

      # `supabase start` applies supabase/migrations in filename order against a
      # fresh database. Reaching the end of this step is itself the bootstrap
      # assertion: the full 001->021 chain applied cleanly from scratch,
      # including the pg_cron work in 008 and 021.
      - name: Start local Supabase (applies migrations 001-021 from scratch)
        run: supabase start

      # Explicit from-scratch re-apply of the whole chain, so the bootstrap
      # assertion does not depend on whatever `supabase start` cached.
      - name: Re-apply migrations from scratch
        run: supabase db reset

      - name: Report applied migration chain
        run: |
          supabase migration list --local || true
          echo "--- migration files in repo ---"
          ls supabase/migrations

      # If pgTAP resolution fails again, this puts the reason in the step output
      # instead of leaving it to guesswork -- the raw job log needs admin scope
      # to download, so the diagnosis has to be visible here.
      - name: Probe pgTAP availability
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$PGURL" -c "select name, default_version, installed_version from pg_available_extensions where name = 'pgtap';"
          psql "$PGURL" -c "select extname, nspname from pg_extension e join pg_namespace n on n.oid = e.extnamespace;"
          echo "--- test files discovered ---"
          ls -la supabase/tests

      # Schema, policies, grants and constraints. Asserts the real denials, not
      # the presence of a DROP POLICY line.
      - name: pgTAP database tests
        run: supabase test db

      - name: Install concurrency test deps
        working-directory: supabase/tests/concurrency
        run: npm install --no-audit --no-fund

      # Real overlapping transactions: exactly-once resolution, ELO applied
      # once, expiry refusal, global set claims, invite max_uses, and a shared
      # player across two simultaneous resolutions.
      - name: Concurrency tests (real simultaneous transactions)
        working-directory: supabase/tests/concurrency
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node run.mjs

      - name: Dump database logs on failure
        if: failure()
        run: supabase status || true

      # `if: always()` so a failed assertion still tears the stack down and the
      # runner does not leak containers.
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
